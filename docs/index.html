<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Comerciales - Stocker</title>
<style>
  :root {
    --bg: #f4f2ee; --surface: #fff; --text: #1d1c1a; --muted: #6b675f;
    --line: #dedad2; --accent: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141312; --surface: #1e1d1b; --text: #eeebe5; --muted: #9a958b;
            --line: #2f2d2a; --accent: #fb923c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 28px 16px 8px; max-width: 1200px; margin: 0 auto; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }

  #player { display: none; background: var(--surface); border: 1px solid var(--line);
            border-radius: 10px; overflow: hidden; margin-bottom: 24px; }
  #player.open { display: block; }
  #player video { display: block; width: 100%; max-height: 72vh; background: #000; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 12px 14px; flex-wrap: wrap; }
  .bar .info { flex: 1; min-width: 200px; }
  .bar h2 { margin: 0; font-size: 18px; }
  .bar .meta { color: var(--muted); font-size: 13px; }
  .bar button { background: none; border: 1px solid var(--line); color: var(--text);
                border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .bar button:hover { border-color: var(--accent); color: var(--accent); }
  .bar a.btn { border: 1px solid var(--accent); color: var(--accent); border-radius: 6px;
               padding: 6px 12px; text-decoration: none; }
  .bar a.btn:hover { background: var(--accent); color: var(--surface); }
  header a { color: var(--accent); }

  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
          overflow: hidden; cursor: pointer; text-align: left; padding: 0; color: inherit;
          font: inherit; transition: border-color .15s, transform .15s; }
  .card:hover, .card:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
  .card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .thumb { position: relative; aspect-ratio: 4 / 3; background: #000; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dur { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.75); color: #fff;
         font-size: 12px; padding: 1px 6px; border-radius: 4px; font-variant-numeric: tabular-nums; }
  .num { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.75); color: #fff;
         font-size: 12px; padding: 1px 6px; border-radius: 4px; }
  .body { padding: 10px 12px 12px; }
  .body strong { display: block; }
  .body span { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Comerciales - Stocker</h1>
  <p id="count"></p>
  <p><a href="https://drive.google.com/drive/folders/1HSX5Ujj5D1dhY6OYQFMl-xsE_jPBEDrS" target="_blank" rel="noopener">⬇ Descargar todos en alta calidad (Google Drive)</a></p>
</header>
<main>
  <section id="player" aria-live="polite">
    <video id="video" controls playsinline></video>
    <div class="bar">
      <div class="info"><h2 id="title"></h2><div class="meta" id="meta"></div></div>
      <button id="prev">‹ Anterior</button>
      <button id="next">Siguiente ›</button>
      <a class="btn" id="dl" download>⬇ Descargar</a>
      <label class="meta"><input type="checkbox" id="auto" checked> Reproducir todo</label>
    </div>
  </section>
  <div class="grid" id="grid"></div>
</main>
<script>
const SPOTS = [
  ["01-ford-pickup-orca", "Ford Pick-up", "“Orca” · Autolatina · J. W. Thompson", 76],
  ["02-exquisita-bahia", "Exquisita Gelatina", "“Bahía” · Molinos · Casares Grey", 29],
  ["03-exquisita-bahia-ciudad", "Exquisita Gelatina", "“Bahía Ciudad” · Molinos · Casares Grey", 29],
  ["04-derby-suaves", "Derby Suaves", "“El sabor del éxito”", 37],
  ["05-bioden", "Bioden", "Pasta dental (fragmento)", 10],
  ["06-cisko", "Cisko", "Chocolate con leche y maní", 22],
  ["07-7up-cristalina-y-natural", "7Up", "“Cristalina y natural”", 77],
  ["08-dufour-survival-hombre", "Dufour Survival", "“Hombre” · Estévez", 20],
  ["09-dufour-survival-mujer", "Dufour Survival", "“Mujer” · Estévez", 20],
  ["10-dufour-survival-pareja", "Dufour Survival", "“Pareja” · Estévez", 20],
  ["11-adams-el-hombre-en-esencia", "Adam's", "“El hombre en esencia”", 19],
  ["12-ford-squash", "Ford", "“Que hoy se lleva un Ford, délo por descontado”", 19],
  ["13-visa-papa", "VISA", "“Papá” (Día del Padre) · Sistarbanc · Emeka", 29],
  ["14-alfalfa-dekalb-192", "Alfalfa DeKalb 192", "“La calidad que persiste” · Merch & Dise", 44],
  ["15-nestle-mash-25-horas", "Nestlé Mash", "“25 horas” · Gowland · Encuadre Color", 38],
  ["16-jockey-la-pura-verdad", "Jockey", "“La pura verdad” · Nobleza Piccardo", 27],
  ["17-shell-helix", "Shell Helix", "“Lo más importante es usted”", 75],
  ["18-brahma-teaser", "Brahma", "Teaser", 6],
  ["19-brahma-bar", "Brahma", "Bar", 60],
  ["20-brahma-bar-30", "Brahma", "Bar (versión corta)", 30],
  ["21-esso-taxi-espacial", "Esso", "“Taxi espacial” · El viaje es mejor", 38],
  ["22-quilmes-futbol", "Quilmes", "Fútbol · “El sabor del encuentro”", 65],
];

const $ = id => document.getElementById(id);
const video = $("video"), grid = $("grid");
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
let current = -1;

$("count").textContent = `${SPOTS.length} comerciales · ${fmt(SPOTS.reduce((t, s) => t + s[3], 0))} en total`;

SPOTS.forEach(([file, brand, sub, dur], i) => {
  const b = document.createElement("button");
  b.className = "card";
  b.innerHTML = `<div class="thumb"><img loading="lazy" src="thumbs/${file}.jpg" alt="">
      <span class="num">${i + 1}</span><span class="dur">${fmt(dur)}</span></div>
    <div class="body"><strong></strong><span></span></div>`;
  b.querySelector("strong").textContent = brand;
  b.querySelector(".body span").textContent = sub;
  b.onclick = () => play(i, true);
  grid.appendChild(b);
});

function play(i, scroll) {
  if (i < 0 || i >= SPOTS.length) return;
  current = i;
  const [file, brand, sub] = SPOTS[i];
  video.src = `videos/${file}.mp4`;
  $("dl").href = video.src;
  $("dl").download = `${file}.mp4`;
  video.play().catch(() => {});
  $("title").textContent = `${i + 1}. ${brand}`;
  $("meta").textContent = sub;
  $("player").classList.add("open");
  [...grid.children].forEach((c, j) => c.classList.toggle("active", j === i));
  if (scroll) $("player").scrollIntoView({ behavior: "smooth", block: "start" });
  history.replaceState(null, "", `#${i + 1}`);
}

$("prev").onclick = () => play(current - 1);
$("next").onclick = () => play(current + 1);
video.onended = () => { if ($("auto").checked) play(current + 1); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" && e.shiftKey) play(current + 1);
  if (e.key === "ArrowLeft" && e.shiftKey) play(current - 1);
});

const start = parseInt(location.hash.slice(1), 10);
if (start >= 1 && start <= SPOTS.length) play(start - 1, false);
</script>
</body>
</html>
